version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile # Assumes your Python app's Dockerfile is in the ./app directory
    volumes:
      - ./app:/usr/src/app  # Mount your app code into the container
    ports:
      - "8080:8080"  # Map port 8080 on the host to port 8080 on the container
    environment:
      - FLASK_ENV=development  # Example environment variable, adjust as needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "666:666"
      - "777:777"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    command: /bin/sh -c "dockerize -wait tcp://app:8080 -timeout 30s nginx -g 'daemon off;'"
